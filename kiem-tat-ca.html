<div id="khung"><iframe id="fr"></iframe></div>
<pre id="ra">Bam Chay...</pre>
<script>
var PAGES = ["404.html", "bai-viet/ai-lam-nhanh-phan-da-dung.html", "bai-viet/bon-cau-toi-nghe-nhieu-nhat.html", "bai-viet/cai-nut-that-mang-ten-ban.html", "bai-viet/chan-doan-truoc-khi-ke-don.html", "bai-viet/cong-dong-khong-phai-nhom-dang-bai.html", "bai-viet/de-toi-suy-nghi-them.html", "bai-viet/do-cong-dong-bang-gi.html", "bai-viet/giao-quyen-ma-khong-mat-kiem-soat.html", "bai-viet/khi-nao-nen-noi-khong.html", "bai-viet/kho-cau-chuyen.html", "bai-viet/kinh-nghiem-phai-thanh-he-thong.html", "bai-viet/lanh-dia-chuyen-mon.html", "bai-viet/muoi-bon-ngay-dau.html", "bai-viet/nam-thu-lam-nen-mot-he-thong.html", "bai-viet/nam-viec-cua-mot-nguoi-co-van.html", "bai-viet/nhip-lam-noi-dung.html", "bai-viet/thuong-hieu-khong-xay-bang-so-bai-dang.html", "bai-viet/uy-tin-khong-phai-de-noi-tieng.html", "bai-viet/vi-sao-giam-gia-lam-hong-quan-he.html", "bai-viet/vi-sao-toi-khong-dung-phieu.html", "blog.html", "chuong-trinh.html", "chuong-trinh/co-van-rieng.html", "chuong-trinh/community-growth-system.html", "chuong-trinh/cong-dong-thanh-vien.html", "chuong-trinh/diamond-founder-club.html", "chuong-trinh/founder-growth-system.html", "chuong-trinh/giai-phap-doanh-nghiep.html", "chuong-trinh/the-trusted-advisor.html", "chuong-trinh/the-trusted-creator.html", "index.html", "kenh-youtube.html", "lien-he.html", "phuong-phap.html", "podcast.html", "sach.html", "ve-toi.html"];
var KHO = 1400;
function nap(u,w){return new Promise(function(res){
  var fr=document.getElementById('fr'); fr.style.width=w+'px';
  fr.onload=function(){ setTimeout(function(){res(fr)},420); };
  fr.src=u+'?static=1&kiem=1&_='+Math.random();
});}
function chay(fr,ma){ return fr.contentWindow.eval(ma); }
window.kiemAnh = async function(w){
  var ka = await (await fetch('kiem-anh.js')).text();
  var out=[];
  for(var i=0;i<PAGES.length;i++){
    var fr = await nap(PAGES[i], w);
    try{ var a=JSON.parse(chay(fr,ka)); if(a.length) out.push({t:PAGES[i], anh:a}); }catch(e){ out.push({t:PAGES[i], loi:e.message}); }
  }
  return JSON.stringify({kho:w, soTrangLoi:out.length, ds:out});
};
window.chayTatCa = async function(w){
  var kc = await (await fetch('kiem-chu.js')).text();
  var km = await (await fetch('kiem-mo-coi.js')).text();
  var out=[];
  for(var i=0;i<PAGES.length;i++){
    var fr = await nap(PAGES[i], w);
    var a,b,tran;
    try{ a=JSON.parse(chay(fr,kc)); }catch(e){ a={loi:'EXC '+e.message}; }
    try{ b=JSON.parse(chay(fr,km)); }catch(e){ b={loi:'EXC '+e.message}; }
    try{ tran = fr.contentDocument.documentElement.scrollWidth>fr.contentWindow.innerWidth; }catch(e){ tran='?'; }
    out.push({t:PAGES[i], chu:a.loi, ds:a.danhSach, ol:a.overlap, bv:a.banVeQuaRong, moCoi:b.loi, dsm:b.danhSach, tran:tran});
  }
  return JSON.stringify({kho:w, tong:out.length,
    loi: out.filter(function(o){return o.chu||o.moCoi||o.tran===true}),
    ok: out.filter(function(o){return !(o.chu||o.moCoi||o.tran===true)}).length});
};
</script></body></html>
