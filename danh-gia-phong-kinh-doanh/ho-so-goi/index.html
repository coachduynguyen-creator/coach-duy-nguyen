 background:radial-gradient(ellipse at 50% 42%,#1B2C4C 0%,#0C1628 55%,#060C18 100%);padding:16mm 20mm 16mm;display:flex;flex-direction:column;align-items:center}

/* Trang trong */
.phan{break-before:page}
.dau{margin:0 0 6mm}
.dau .kic{font-family:var(--mono);font-size:8pt;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--vgd)}

.nhan{font-family:var(--mono);font-size:7.5pt;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--vgd);margin-bottom:2pt}

table.bang{width:100%;border-collapse:collapse;margin:4pt 0;font-size:9.2pt}

.thanh{height:5pt;width:26mm;background:#ECE6D8;border-radius:3pt;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:5pt}
.thanh i{display:block;height:100%}
.muc{display:inline-block;font-size:7.8pt;font-weight:700;border-radius:8pt;padding:1pt 7pt;white-space:nowrap}
.m0{background:#F7E2E0;color:var(--do)}.m1{background:#F6E9CC;color:var(--vgd)}.m2{background:var(--nv);color:var(--vg)}

.sodo .h{display:flex;align-items:stretch;margin:0 0 2.5mm;break-inside:avoid}

.sodo .c{flex:1;background:var(--nga);border-radius:0 2mm 2mm 0;padding:5pt 11pt}

.sodo .t b{font-family:var(--tit);font-size:11pt}
.sodo .t .en{font-family:var(--mono);font-size:7.5pt;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--vgd)}

.tranh{display:flex;justify-content:center;margin:0 0 4pt}
.tranh svg{width:100mm;height:auto}
.chuoi{display:flex;align-items:stretch;gap:1.2mm;margin:6pt 0}
.chuoi div{flex:1;border-radius:2mm;padding:5pt 2pt;text-align:center;font-size:8pt;line-height:1.3}
.chuoi div b{display:block;font-family:var(--tit);font-size:11pt;color:inherit}
.chuoi em{align-self:center;font-style:normal;color:var(--vgd);font-weight:700}

.tru{break-inside:avoid;margin:0 0 8mm}
.dai{position:relative;overflow:hidden;display:flex;align-items:stretch;margin:0 0 8pt;border-radius:2.5mm;background:var(--nv);color:var(--nga)}

.dai .so b{font-family:var(--tit);font-weight:800;font-size:24pt;line-height:1;color:var(--vg)}
.dai .ten{flex:1;padding:7pt 14pt;display:flex;flex-direction:column;justify-content:center}
.dai .ten b{font-family:var(--tit);font-weight:800;font-size:16pt;line-height:1.15;color:var(--nga)}
.dai .ten span{font-family:var(--mono);font-size:7.5pt;font-weight:600;letter-spacing:.2em;color:var(--vg)}
.dai .diem{padding:7pt 14pt;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:3pt}
.dai .diem b{font-family:var(--tit);font-weight:800;color:var(--vg);font-size:20pt;line-height:1}

.dai .m2{background:var(--vg);color:var(--nv2)}
.hoi{font-family:var(--tit);font-size:11pt;font-weight:800;color:var(--vgd);margin:0 0 4pt}

.can{display:flex;align-items:center;gap:2.5mm;font-size:9pt;padding:2pt 0;border-bottom:1px dashed var(--ke)}

.lamro{font-size:9.2pt;color:var(--nv)} .lamro span,.tot span{font-family:var(--mono);font-size:7.5pt;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--vgd)}
.tot{font-size:9.2pt;color:var(--phu)} .lq{font-style:normal;color:var(--vgd);font-size:8.6pt}
td.tl{width:30mm;text-align:right}

ol.buoc{margin:2pt 0 8pt;padding-left:16pt} ol.buoc li{margin:0 0 6pt}
.cuoi{display:flex;justify-content:space-between;align-items:center;margin-top:9mm;padding:6mm 7mm;background:var(--nv);border-radius:3mm;break-inside:avoid;color:var(--nga)}
