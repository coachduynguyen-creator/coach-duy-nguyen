/* Màu, phông, logo theo deliverables/NGF - Tiêu chuẩn thiết kế slide và hình chiếu.md (16/10/2026) */
:root{--nv:#0C1628;--nv2:#08101E;--khoi:#0E1A2E;--vg:#E6C274;--vgn:#F5DFA5;--vgd:#8F6528;--nga:#F4F1EA;--do:#C4302B;--chu:#0E1A2E;--phu:#5A6170;--ke:#E2DCCD;
 --tit:'Be Vietnam Pro',sans-serif;--than:'Be Vietnam Pro',sans-serif;--mono:'Be Vietnam Pro',sans-serif}
*{box-sizing:border-box}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:var(--than);color:var(--chu);font-size:10.2pt;line-height:1.6;margin:0;background:#fff}
.giay{max-width:180mm;margin:0 auto;padding:16px}
@media print{.giay{max-width:none;padding:0}}
p{margin:0 0 8pt} b{color:var(--nv)}
.muted{color:var(--phu)}
.giu{break-inside:avoid}
body.chi-bia section,body.chi-than .bia{display:none}
body.chi-bia .giay{padding:0;max-width:none}

/* Bìa: tràn trang, nền navy chuyển màu, sàn bàn cờ, 2 logo */
.bia{width:210mm;height:297mm;position:relative;overflow:hidden;isolation:isolate;color:var(--nga);text-align:center;
 background:radial-gradient(ellipse at 50% 42%,#1B2C4C 0%,#0C1628 55%,#060C18 100%);padding:16mm 20mm 16mm;display:flex;flex-direction:column;align-items:center}
.bia:before{content:"";position:absolute;left:-40%;right:-40%;bottom:-2%;height:62%;z-index:-1;
 background:repeating-conic-gradient(rgba(230,194,116,.12) 0 25%,transparent 0 50%) 50% 100%/24mm 24mm;
 transform:perspective(120mm) rotateX(60deg);transform-origin:50% 100%;
 -webkit-mask-image:linear-gradient(to top,#000,rgba(0,0,0,.45) 55%,transparent);mask-image:linear-gradient(to top,#000,rgba(0,0,0,.45) 55%,transparent)}
.cdn{display:flex;align-items:center;gap:3mm;font-family:var(--tit);font-weight:800;font-size:13pt;color:var(--nga)}
.cdn img{height:11mm}
.bia .kic{margin-top:62mm}
.bia .kic{font-family:var(--mono);font-size:9pt;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--vg)}
.bia h1{font-family:var(--tit);font-weight:800;font-size:34pt;line-height:1.08;letter-spacing:-.01em;text-transform:uppercase;margin:5mm 0 5mm;color:var(--vg)}
.bia .phu{font-size:12.5pt;color:var(--vgn);max-width:150mm;line-height:1.5}
.bia .ba{display:flex;gap:4mm;margin-top:12mm;width:100%}
.bia .ba div{flex:1;border:1px solid rgba(230,194,116,.45);border-radius:3mm;padding:4mm;background:rgba(12,22,40,.55)}
.bia .ba b{display:block;font-family:var(--tit);font-weight:800;font-size:20pt;color:var(--vg);line-height:1.15}
.bia .ba span{font-family:var(--mono);font-size:9pt;letter-spacing:.14em;text-transform:uppercase;color:var(--vgn)}
.bia .lap{margin-top:auto;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:3mm 10mm;text-align:left;border-top:1px solid rgba(230,194,116,.4);font-size:9.5pt;background:rgba(6,12,24,.6);padding:5mm 6mm;border-radius:3mm}
.bia .lap span{display:block;font-family:var(--mono);font-size:8pt;letter-spacing:.14em;text-transform:uppercase;color:var(--vg)}
.bia .mat{font-size:8pt;color:#A9B0BE;margin-top:4mm}

/* Trang trong */
.phan{break-before:page} table.bang.diem{break-inside:avoid} .dau{break-after:avoid} p,li{orphans:3;widows:3} .rui h4+p,.tranh{break-before:avoid}
.dau{margin:0 0 6mm}

.m0{background:#F7E2E0;color:var(--do)}.m1{background:#F6E9CC;color:var(--vgd)}.m2{background:var(--nv);color:var(--vg)}

.sodo .h{display:flex;align-items:stretch;margin:0 0 2.5mm;break-inside:avoid}

 "3.1":"Viết ra trên 1 trang kiểu người cần tuyển làm nhân viên kinh doanh, dùng cho lần tuyển tới.",
 "3.2":"Chọn sẵn tên 1 nhân viên có kinh nghiệm để kèm mỗi người mới trong 90 ngày đầu.",
 "3.3":"Liệt kê các kỹ năng một nhân viên bán hàng cần có, rồi đánh dấu từng người mới còn thiếu kỹ năng nào để kèm đúng chỗ đó.",
 "3.4":"Viết ra nhân viên kinh doanh phải đạt gì thì được tăng lương hoặc lên chức, rồi nói chuyện riêng với từng người giỏi.",
 "4.1":"Viết lại cách tính thu nhập trên 1 trang để mỗi nhân viên kinh doanh tự tính được.",
 "4.2":"Báo cách tính thưởng từ đầu kỳ và giữ nguyên tới cuối kỳ.",
 "4.3":"Viết quy định giao lại khách khi nhân viên kinh doanh nghỉ, kể cả hoa hồng của những khách đó.",
 "4.4":"Tính chi phí để có một khách mua từ số liệu 3 tháng gần nhất.",
 "5.1":"Đưa thông tin khách về một bảng tính hoặc phần mềm chung của công ty. Chưa có phần mềm thì dùng bảng tính chung trước.",
 "5.2":"Cả nhóm chốt 3 mục phải ghi lại sau mỗi lần nói chuyện với khách: khách hỏi gì, đã báo giá bao nhiêu, hẹn gì.",
 "5.3":"Làm một mẫu báo giá chung cho cả nhóm.",
 "5.4":"Ghi mọi khách mới vào bảng tính chung ngay trong ngày, để quản lý tự mở ra xem mà không phải hỏi.",
 "6.1":"Chia lại chỉ tiêu theo tháng cao điểm và tháng thấp điểm của ngành.",
 "6.2":"Chọn một ngày giữa tháng để quản lý ước tháng đó đạt bao nhiêu phần chỉ tiêu.",
 "6.3":"Xem số khách ở từng bước bán vào một buổi cố định mỗi tuần.",
 "6.4":"Ghi lại thời gian trả lời khách mới và xem con số này mỗi tuần.",
 "7.1":"Dành lịch cố định mỗi tuần để quản lý ngồi nghe và góp ý cho từng nhân viên kinh doanh.",
 "7.2":"Đặt lịch họp tuần 30 phút, kết thúc bằng việc giao cho từng người, và tuần sau xem lại việc đó.",
 "7.3":"Viết ra việc nào quản lý tự quyết, việc nào phải hỏi người chủ, rồi báo cho cả nhóm.",
 "7.4":"Khi đổi sang cách làm mới, giao một người theo dõi mỗi tuần trong 2 tháng đầu."
};
function viecDau(x) {
  const m = mucDo(x.d), p = TRU[x.i];
  const AC = t => "Anh chị " + t.charAt(0).toLowerCase() + t.slice(1);
  if (m === 2) return "Giữ cách làm hiện tại.";
  if (!DICH[x.i][m].some(c => tl(c) === 2)) return AC(p.dau[m]);
  const con = p.cau.map((q, j) => (x.i+1)+"."+(j+1)).filter(c => tl(c) < 2).sort((a, b) => tl(a) - tl(b))[0];
  return AC(LAM[con]);
}

// Bản web: dữ liệu khách nằm sau dấu # của đường dẫn (#k=...), trình duyệt không gửi phần này lên máy chủ.
// k là JSON mã hóa base64url (UTF-8): {hoTen, congTy, nganh, soNguoiBan, nguoiCham, ngay, ma, a}
// a là 28 chữ số 0, 1, 2 theo thứ tự M1 câu 1 tới M7 câu 4 (0 Chưa đúng, 1 Đúng một phần, 2 Đúng hoàn toàn).
const KHACH = (() => {
  try {
    const b = location.hash.replace(/^#k=/, "").replace(/-/g, "+").replace(/_/g, "/");
    const k = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b), c => c.charCodeAt(0))));
    if (!/^[012]{28}$/.test(k.a || "")) return null;
    k.congTy = k.congTy || k.hoTen;
    return k;
  } catch (e) { return null; }
})();
if (!KHACH) {
  document.body.innerHTML = '<p style="font-family:sans-serif;max-width:520px;margin:15vh auto;padding:0 16px;line-height:1.6">Đường dẫn báo cáo chưa đầy đủ. Anh chị mở lại đường dẫn trong thư kết quả, hoặc trả lời thư đó để đội ngũ gửi lại.</p>';
  throw new Error("thiếu dữ liệu khách");
}
const st = {a: {}};
[...KHACH.a].forEach((k, n) => st.a[Math.floor(n / 4) + "_" + (n % 4)] = +k);

function radar(ds) {
  const c = 170, R = 112, n = 7, goc = k => -Math.PI / 2 + k * 2 * Math.PI / n;
  const xy = (k, r) => [c + r * Math.cos(goc(k)), c + r * Math.sin(goc(k))];
  const vong = [2, 4, 6, 8].map(v => `<polygon points="${[...Array(n)].map((_, k) => xy(k, R * v / 8).join(",")).join(" ")}" fill="${v === 8 ? "#F4F1EA" : "none"}" stroke="#D9D1BF"/>`).join("");
  const truc = [...Array(n)].map((_, k) => { const [x, y] = xy(k, R); return `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="#D9D1BF"/>`; }).join("");
  const da = ds.map(x => xy(x.i, R * x.d / 8).join(",")).join(" ");
  const cham = ds.map(x => { const [px, py] = xy(x.i, R * x.d / 8); return `<circle cx="${px}" cy="${py}" r="4" fill="${MAU_MUC[mucDo(x.d)]}" stroke="#fff" stroke-width="1.5"/>`; }).join("");
  const chu = ds.map(x => { const [lx, ly] = xy(x.i, R + 30); return `<text x="${lx}" y="${ly - 3}" text-anchor="middle" font-size="10.5" font-weight="800" font-family="Be Vietnam Pro" fill="#0C1628">M${x.i+1} ${TRU[x.i].ten}</text><text x="${lx}" y="${ly + 10}" text-anchor="middle" font-size="9" fill="#8F6528" font-family="Be Vietnam Pro" font-weight="600">${x.d}/8</text>`; }).join("");
  return `<svg viewBox="0 0 340 340" role="img" aria-label="Điểm 7 trụ cột">${vong}${truc}<polygon points="${da}" fill="rgba(230,194,116,.38)" stroke="#8F6528" stroke-width="2"/>${cham}${chu}</svg>`;
}

  <div class="kic">Chương trình đi cùng Coach Duy Nguyễn</div>
  <h2>Làm cho phòng kinh doanh bán đều hơn</h2>
  <p class="tcphu">Tùy điểm của anh chị và số người bán hàng đang có, một trong 4 chương trình dưới đây có thể hợp với công ty mình.</p>
  <div class="gl">
  <div class="gc"><div class="gn">1</div><b>Chương trình 4 buổi Lập kế hoạch kinh doanh và bán hàng 2027</b><p><em>Dành cho</em> Chủ doanh nghiệp ở mọi quy mô cần kế hoạch cho năm mới.</p><p><em>Giúp giải quyết</em> Sắp hết năm mà chưa có kế hoạch, hoặc có chỉ tiêu doanh số nhưng chưa biết mỗi tháng nhân viên bán hàng phải làm những việc gì để đạt.</p><p><em>Kết quả</em> Kế hoạch kinh doanh năm 2027 gói trong 1 trang và kế hoạch bán hàng cho doanh nghiệp mình.</p></div>
  <div class="gc"><div class="gn">2</div><b>30 ngày thiết kế phòng kinh doanh theo mô hình 7M</b><p><em>Dành cho</em> Chủ doanh nghiệp có từ 2 người bán trở lên, cùng làm với 1 quản lý kinh doanh.</p><p><em>Giúp giải quyết</em> Mỗi người tư vấn một kiểu. Đơn lớn nào cũng phải có chủ doanh nghiệp vào chốt. Quản lý đến cuối tháng mới thấy doanh số, không biết khách rớt ở bước nào.</p><p><em>Kết quả</em> Bản thiết kế 7 trụ cột cho phòng kinh doanh của mình, và 2 tới 3 việc đã làm thật, như quy trình tư vấn khách, bảng số theo dõi, lịch họp tuần.</p></div>
  <div class="gc"><div class="gn">3</div><b>Cùng dựng phòng kinh doanh trong 3 tháng</b><p><em>Dành cho</em> Công ty đã có bản thiết kế phòng kinh doanh nhưng thiếu người hoặc thiếu thời gian tự dựng.</p><p><em>Giúp giải quyết</em> Có bản thiết kế rồi nhưng cả nhóm bán hàng vẫn chưa làm theo được.</p><p><em>Kết quả</em> Phòng kinh doanh có quy trình viết sẵn, bảng số theo dõi và công cụ dùng được. Nhân viên bán hàng được cầm tay chỉ việc cách dùng.</p></div>
  <div class="gc"><div class="gn">4</div><b>Master Club, đi cùng Coach Duy Nguyễn 1 năm</b><p><em>Dành cho</em> Chủ doanh nghiệp đã làm việc thử với Coach Duy Nguyễn và muốn có người đi cùng mỗi tuần.</p><p><em>Giúp giải quyết</em> Một mình quyết mọi việc kinh doanh, biết cần làm gì nhưng khó làm đều mỗi tuần.</p><p><em>Kết quả</em> Mỗi tuần cùng xem một vấn đề kinh doanh thật, chọn 1 việc để làm, tuần sau báo lại, có nhóm chủ doanh nghiệp khác cùng làm.</p></div>
  </div>
  <div class="tccta"><b>Trao đổi với đội ngũ Coach Duy Nguyễn</b><p>Đội ngũ sẽ gọi cho anh chị theo số điện thoại đã để lại. Anh chị cùng đội ngũ xem lại kết quả này và chọn chương trình hợp nhất, để nhân viên bán hàng của công ty bán được đều hơn.</p></div>
