<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quản trị thử thách 7 ngày</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Bố cục: thanh bên trái (4 mục), thanh trên có ô tìm kiếm, nội dung bên phải, hồ sơ thành viên mở thành ngăn kéo bên phải để sales đi hết danh sách mà không rời trang. */
:root{
  --bg:#f1f4f5; --pn:#ffffff; --ln:#dce2e5; --fg:#15202a; --mu:#5b6a75; --sb:#10302d; --sbf:#cfe4e1;
  --ac:#0e6b63; --ac2:#d7eeeb; --warn:#9a5700; --warn2:#fbeed4; --bad:#a3302b; --bad2:#f8e1df; --ok:#1d7a46; --ok2:#dcf0e4; --sh:0 10px 30px rgba(10,30,40,.18);
  --ft:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1519; --pn:#182026; --ln:#2a353d; --fg:#e6ecef; --mu:#93a3ad; --sb:#0a1e1c; --sbf:#b7d4d0;
  --ac:#4fc2b6; --ac2:#14332f; --warn:#e8b25a; --warn2:#3a2c12; --bad:#ee8d86; --bad2:#3b1e1c; --ok:#6fcf97; --ok2:#16331f; --sh:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1519; --pn:#182026; --ln:#2a353d; --fg:#e6ecef; --mu:#93a3ad; --sb:#0a1e1c; --sbf:#b7d4d0;
  --ac:#4fc2b6; --ac2:#14332f; --warn:#e8b25a; --warn2:#3a2c12; --bad:#ee8d86; --bad2:#3b1e1c; --ok:#6fcf97; --ok2:#16331f; --sh:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--ft);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.sb{background:var(--sb);color:var(--sbf);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding-left:max(12px,env(safe-area-inset-left,0px))}
.sb h1{font-size:13px;line-height:1.35;margin:4px 8px 16px;color:#fff;font-weight:700}
.sb h1 small{display:block;font-weight:400;color:var(--sbf);margin-top:2px;font-size:11.5px}
.sb button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--sbf)}
.sb button:hover{background:rgba(255,255,255,.08)}
.sb button[aria-current=page]{background:rgba(255,255,255,.16);color:#fff}
.sb button:focus-visible{outline:2px solid #fff}
.sb .sl{font-size:11.5px;background:rgba(255,255,255,.14);border-radius:99px;padding:0 7px;color:#fff;font-variant-numeric:tabular-nums}
.sb .ft{margin-top:auto;font-size:11.5px;padding:8px;color:var(--sbf)}
.mn{min-width:0;padding-inline:20px max(20px,env(safe-area-inset-right,0px));padding-block:0 48px}
.mau{background:var(--warn2);color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:7px 12px;margin:12px 0 0;font-size:12.5px}
.tp{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:14px 0 12px}
.tp h2{margin:0;font-size:20px;font-weight:700;flex:1 1 auto;min-width:160px}
.in{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:7px 10px;min-width:0}
.in:focus-visible,button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.tp .in{width:230px}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--ln);background:var(--pn);border-radius:99px;padding:2px 10px;font-size:12px;color:var(--mu);white-space:nowrap}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.s2{grid-column:span 2}.s4{grid-column:span 4}.s5{grid-column:span 5}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
@media(max-width:1180px){.s2{grid-column:span 4}.s4{grid-column:span 6}.s5,.s7,.s8{grid-column:span 12}}
@media(max-width:720px){.s2,.s4{grid-column:span 12}.s2{grid-column:span 6}}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:14px 16px;min-width:0}
.pn h3{font-size:14px;margin:0 0 2px;font-weight:700}
.pn .gc{color:var(--mu);font-size:12.5px;margin:0 0 12px}
.col{display:grid;gap:14px;align-content:start}
.kp b{display:block;font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums}
.kp span{color:var(--mu);font-size:12.5px}
.kp .dl{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:6px;font-size:12px;color:var(--mu)}
.up{color:var(--ok);font-weight:600}.dn{color:var(--bad);font-weight:600}
.kp svg{width:72px;height:24px;flex:none}
.fn{display:grid;grid-template-columns:78px minmax(0,1fr) 112px;gap:6px 10px;align-items:center;font-size:12.5px}
.fn .br{height:20px;background:var(--bg);border-radius:4px;overflow:hidden;display:flex}
.fn .br i{display:block;height:100%}
.fn .d{background:var(--ac)}.fn .t{background:var(--warn)}
.fn .nu{text-align:right;font-variant-numeric:tabular-nums;color:var(--mu)}
.fn .nu b{color:var(--fg)}
.fn .xa{opacity:.45}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mu);margin-top:10px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.ct{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ct li button{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--ln);border-radius:6px;padding:9px 12px;cursor:pointer}
.ct li button:hover{border-color:var(--ac);background:var(--ac2)}
.ct li button:focus-visible{outline:2px solid var(--ac)}
.ct b{font-size:20px;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.ct small{display:block;color:var(--mu);font-size:12px}
.b4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.b4 button{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--ln);border-radius:6px;padding:8px 10px}
.b4 button:hover{border-color:var(--ac)}
.b4 button.a{background:var(--ac2);border-color:var(--ac)}
.b4 b{font-size:22px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.b4 span{font-size:12px;color:var(--mu)}
.wk{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 40px;gap:6px 10px;align-items:center;font-size:12.5px}
.wk .br{height:12px;background:var(--bg);border-radius:3px;overflow:hidden}
.wk .br i{display:block;height:100%;background:var(--mu);opacity:.55}
.wk .top span{font-weight:700;color:var(--bad)}.wk .top i{background:var(--bad);opacity:1}
.wk .nu{text-align:right;font-variant-numeric:tabular-nums}
.sk{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--bg);margin:4px 0 6px}
.sk i{display:block;height:100%}
.cm{margin-bottom:14px}.cm:last-child{margin:0}
.cm h4{margin:0;font-size:12.5px;font-weight:600}
.cm .lg{margin-top:2px}
.tb{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.02em;color:var(--mu);text-align:left;padding:9px 6px;border-bottom:1px solid var(--ln);white-space:nowrap;background:var(--pn);position:sticky;top:0}
th button{all:unset;cursor:pointer}
th button:focus-visible{outline:2px solid var(--ac)}
td{padding:9px 6px;border-bottom:1px solid var(--ln);vertical-align:middle}
.cp td{padding-block:4px}
tr.row td{white-space:nowrap}
tr.row td:nth-child(2){min-width:150px}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--bg)}
tr.on td{background:var(--ac2)}
.sm td{font-size:12.5px}
.sm th{letter-spacing:0;font-size:11px}.sm th,.sm td{padding-inline:5px}.sm td:first-child{white-space:nowrap}
td .su{display:block;color:var(--mu);font-size:11.5px}
.dots{display:flex;gap:3px}
.dots i{width:12px;height:12px;border-radius:3px;background:var(--ln);display:block}
.dots i.dung{background:var(--ok)}.dots i.tre{background:var(--warn)}
.tag{display:inline-block;border-radius:4px;padding:1px 7px;font-size:11.5px;font-weight:600;white-space:nowrap}
.t-ok{background:var(--ok2);color:var(--ok)}.t-w{background:var(--warn2);color:var(--warn)}.t-b{background:var(--bad2);color:var(--bad)}.t-n{background:var(--bg);color:var(--mu);border:1px solid var(--ln)}.t-a{background:var(--ac2);color:var(--ac)}
.mm{font-size:11px;color:var(--mu);border:1px solid var(--ln);border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap}
.mi{display:inline-block;width:46px;height:6px;background:var(--bg);border-radius:3px;vertical-align:middle;margin-left:6px;overflow:hidden;border:1px solid var(--ln)}
.mi i{display:block;height:100%;background:var(--ac)}
.pl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pl button{all:unset;box-sizing:border-box;cursor:pointer;background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:8px 14px;min-width:110px}
.pl button:hover{border-color:var(--ac)}
.pl button[aria-pressed=true]{background:var(--ac);color:var(--pn);border-color:var(--ac)}
.pl b{display:block;font-size:20px;line-height:1.15;font-variant-numeric:tabular-nums}
.pl span{font-size:12px;opacity:.85}
.tl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tl .in{width:auto}
.tl .q{flex:1 1 200px;min-width:160px}
.vw{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;font-size:12.5px;color:var(--mu);align-items:center}
.vw button{all:unset;cursor:pointer;border:1px solid var(--ln);border-radius:99px;padding:2px 11px;background:var(--pn);color:var(--fg)}
.vw button:hover{border-color:var(--ac)}
.bt{border:0;background:var(--ac);color:var(--pn);border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
.bt.p{background:none;color:var(--ac);border:1px solid var(--ac)}
.bt.o{background:none;color:var(--fg);border:1px solid var(--ln)}
.bk{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--ac2);border:1px solid var(--ac);border-radius:6px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.pg{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--mu)}
.pg .nb{display:flex;gap:4px}
.pg .nb button{min-width:32px;border:1px solid var(--ln);background:var(--pn);border-radius:6px;padding:4px 8px;cursor:pointer}
.pg .nb button[aria-current=true]{background:var(--ac);color:var(--pn);border-color:var(--ac)}
.pg .nb button:disabled{opacity:.4;cursor:default}
.ov{position:fixed;inset:0;background:rgba(5,15,20,.45);z-index:20}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(580px,100vw);background:var(--bg);box-shadow:var(--sh);z-index:21;display:flex;flex-direction:column}
.dh{background:var(--pn);border-bottom:1px solid var(--ln);padding:14px 16px;display:flex;gap:10px;align-items:start;justify-content:space-between}
.dh h3{margin:0;font-size:17px}
.dh p{margin:2px 0 0;color:var(--mu);font-size:12.5px}
.dh .nv{display:flex;gap:4px;flex:none}
.dh .nv button{border:1px solid var(--ln);background:var(--pn);border-radius:6px;padding:4px 9px;cursor:pointer}
.db{flex:1;overflow-y:auto;padding:14px 16px;display:grid;gap:12px;align-content:start;padding-right:max(16px,env(safe-area-inset-right,0px))}
.df{background:var(--pn);border-top:1px solid var(--ln);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin:0}
.kv dt{color:var(--mu)}.kv dd{margin:0;text-align:right}
.cr{list-style:none;margin:0;padding:0;font-size:12.5px;columns:2 220px;column-gap:18px}
.cr li{display:flex;gap:6px;padding:3px 0;break-inside:avoid}
.cr li>span:first-child{flex:none;width:14px;font-weight:700}
.cr .y>span:first-child{color:var(--ok)}.cr .n{color:var(--mu)}
.ph{display:grid;grid-template-columns:minmax(0,1.5fr) 56px minmax(0,1fr);gap:4px 10px;align-items:center;font-size:12.5px}
.ph .br{height:9px;background:var(--bg);border-radius:3px;overflow:hidden;border:1px solid var(--ln)}
.ph .br i{display:block;height:100%;background:var(--ac)}
.ph .yeu{color:var(--bad);font-weight:600}.ph .yeu .br i{background:var(--bad)}
blockquote{margin:10px 0 0;padding:9px 12px;border-left:3px solid var(--bad);background:var(--bad2);border-radius:0 6px 6px 0;font-size:13px}
blockquote small{display:block;color:var(--mu);margin-top:3px}
label{display:block;font-size:12.5px;color:var(--mu);margin:9px 0 3px}
select.in,textarea.in,input.in{width:100%}
.ck{display:flex;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.ck input{width:auto;margin:0}.ck label{margin:0;color:var(--fg)}
.ghi{font-size:12px;color:var(--mu);margin:8px 0 0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13px;max-width:90vw;z-index:30}
.hm{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media(max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sb{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px 12px}
  .sb h1{display:none}.sb .ft{display:none}
  .mn{padding-inline:max(14px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-right,0px))}
  .tp .in{width:100%}
}
@media(prefers-reduced-motion:no-preference){.dr{animation:vao .18s ease-out}@keyframes vao{from{transform:translateX(24px);opacity:.4}}}
.hd h3{margin-top:0}.hd .pn{margin-bottom:14px}.hd ol,.hd ul{margin:6px 0 0;padding-left:20px}.hd li{margin:3px 0}.hd p{margin:6px 0}
.mc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.mc button{all:unset;cursor:pointer;border:1px solid var(--ln);border-radius:99px;padding:3px 12px;background:var(--pn);font-size:12.5px}
.mc button:hover{border-color:var(--ac)}.mc button:focus-visible{outline:2px solid var(--ac)}
.ghim{background:var(--warn2);color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:7px 12px;margin:0 0 12px;font-size:12.5px}
</style>
</head>
<body>
<div class="app">
  <aside class="sb">
    <h1>Thử thách 7 ngày<small>Nâng cấp Quy trình Tư vấn Bán hàng</small></h1>
    <button data-v="tq">Tổng quan</button>
    <button data-v="q">Hàng chờ gọi <span class="sl" id="n-q"></span></button>
    <button data-v="tv">Thành viên <span class="sl" id="n-tv"></span></button>
    <button data-v="hd">Hướng dẫn</button>
    <button data-v="cd">Cài đặt</button>
    <div class="ft">Đăng nhập bằng Google. Chỉ email trong danh sách mới mở được trang này.</div>
  </aside>
  <div class="mn">
    <div class="tp">
      <h2 id="ttl">Quản trị</h2>
      <input class="in" id="gq" type="search" placeholder="Tìm tên, điện thoại, email" aria-label="Tìm nhanh">
      <span class="chip" id="vt" style="margin:0"></span>
      <button class="bt o" id="rl" type="button">Tải lại</button>
    </div>
    <div id="main"></div>
  </div>
</div>
<div id="dro"></div>
<div id="toast" hidden></div>

<script>
/* Trang quản trị thử thách 7 ngày, giai đoạn 1: chỉ đọc. Dữ liệu lấy từ layDuLieuQuanTri() trong quan-tri.gs. */
const BUOC = ['Tìm kiếm khách','Tiếp cận và phân loại','Khai thác sâu','Trình bày giải pháp','Xử lý từ chối','Đề nghị khách quyết định','Chăm sóc sau bán'];
const GOI_NGAN = {0:'Chưa rõ quy mô',1:'Cộng đồng',2:'Trả phí (tệp lõi)',3:'Grand Master hoặc cố vấn',4:'Cố vấn hoặc hợp đồng'};
const CELL = { cc: ['Gọi trước','Cam kết cao, phù hợp cao'], ch: ['Gọi, nói hướng khác','Cam kết cao, phù hợp chưa cao'], hc: ['Nuôi thêm','Cam kết chưa cao, phù hợp cao'], th: ['Chưa ưu tiên','Cả hai chưa cao'] };
const NGUON = { may: 'máy đếm', sales: 'sales ghi ở Pancake' };
const MAU = ['#0e6b63','#4a9b94','#9a5700','#a3302b','#7a8791','#b9c4ca'];
const TTL = { tq: 'Tổng quan', q: 'Hàng chờ gọi', tv: 'Thành viên', hd: 'Hướng dẫn', cd: 'Cài đặt' };
const S = { v: 'tq', stage: 'all', q: '', f: { cell: '', cap: '', vt: '', w: '', risk: '' }, sort: { k: 'prio', dir: -1 }, page: 1, size: 25, dr: -1, order: [], thr: 0.6, min: 2, compact: false };
let D = null, P = [];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cong = (s, k) => { const a = s.split('-'); return new Date(Date.UTC(+a[0], a[1] - 1, +a[2] + k)).toISOString().slice(0, 10); };
const dm = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '';
const KT = p => p.ten || p.email;
function toast(t) { const e = $('toast'); e.textContent = t; e.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => e.hidden = true, 3400); }

/* ===== Chuẩn hóa dữ liệu máy chủ ===== */
function chuan(r) {
  const hom = r.hom_nay;
  return r.nguoi.map((p, i) => {
    const ngay = p.ngay.map(d => !d.nop ? '.' : (!p.bat_dau || d.nop <= cong(p.bat_dau, d.n - 1)) ? 'd' : 't').join('');
    const due = p.bat_dau ? p.ngay.filter(d => cong(p.bat_dau, d.n - 1) <= hom).length : 0;
    const nops = p.ngay.map(d => d.nop).filter(Boolean).sort();
    return Object.assign({}, p, { i, pt: ngay, due, k: p.da_nop, ng3: !!p.ngay[2].nop, last: nops.length ? nops[nops.length - 1] : '' });
  });
}
/* risk tính sau khi có due (Object.assign không đọc được thuộc tính vừa gán) */
function nap(r) { P = chuan(r).map(p => (p.risk = !!p.bat_dau && p.due - p.k >= 2 && p.k < 7, p)); }

const o3 = t => t.xet >= S.min ? t.dat / t.xet >= S.thr : null;
const cell = p => { const a = o3(p.ck), b = o3(p.ph); return a === null || b === null ? null : a ? (b ? 'cc' : 'ch') : (b ? 'hc' : 'th'); };
const cellTen = p => cell(p) ? CELL[cell(p)][0] : 'Chưa xếp ô';
const stage = p => p.ng3 ? 'cho' : 'cho3';
const prio = p => ({ cc: 100, ch: 40, hc: 20, th: 0 }[cell(p)] ?? -1) + (p.cap === 2 ? 15 : 0) + p.ck.dat;
const yeu = p => p.yeu ? p.yeu.buoc - 1 : -1;
const dots = p => '<div class="dots" title="Xanh: đúng hạn. Vàng: nộp chậm. Xám: chưa nộp">' + [...p.pt].map(x => '<i class="' + (x === 'd' ? 'dung' : x === 't' ? 'tre' : '') + '"></i>').join('') + '</div>';
const stTag = p => p.ng3 ? '<span class="tag t-w">Chờ gọi</span>' : '<span class="tag t-n">Chưa tới Ngày 3</span>';
const mi = (v, m) => '<span class="mi"><i style="width:' + (m ? v / m * 100 : 0) + '%"></i></span>';
const chua = '<span class="su">chưa đọc từ Pancake</span>';
const pc = (a, b) => b ? Math.round(a / b * 100) : 0;

    '<div class="pn"><h3>Bảy ngày</h3><p class="gc">Đã nộp ' + p.k + ' ngày' + (p.video_tb !== null ? ', video xem trung bình ' + p.video_tb + '%' : '') + (p.bat_dau ? '. Bắt đầu tính từ ' + dm(p.bat_dau) + '.' : '. Chưa điền Cam kết nên chưa có lịch.') + '</p>' + dots(p) +
    '<div class="tb" style="margin-top:8px"><table class="sm"><thead><tr><th>Ngày</th><th>Nộp lúc</th><th>Video</th></tr></thead><tbody>' + p.ngay.map(d => '<tr><td>Ngày ' + d.n + '</td><td>' + (d.nop ? dm(d.nop) : '<span class="su">chưa nộp</span>') + '</td><td>' + (d.video === null ? '<span class="su">chưa có</span>' : d.video + '%') + '</td></tr>').join('') + '</tbody></table></div></div>' +
    (y ? '<div class="pn"><h3>Chỗ yếu nhất trong quy trình bán hàng</h3><p class="gc">Mất nhiều khách nhất ở bước <b>' + y.buoc + '. ' + esc(y.ten) + '</b> (từ ' + y.tu + ' còn ' + y.den + ').</p>' + (y.trich ? '<blockquote>“' + esc(y.trich) + '”<small>Trích từ bài làm của người học.</small></blockquote>' : '<p class="ghi">Người học chưa viết lý do rơi ở bước này.</p>') + '</div>' : '') +
    '<div class="pn"><h3>Hai trục</h3><p class="gc">Cam kết ' + p.ck.dat + '/' + p.ck.xet + ' tiêu chí xét được, phù hợp ' + p.ph.dat + '/' + p.ph.xet + '. Không cộng thành một điểm.</p><b style="font-size:12.5px">Cam kết</b>' + cr(D.tieu_chi.c, p.c) + '<b style="font-size:12.5px;display:block;margin-top:8px">Phù hợp</b>' + cr(D.tieu_chi.d, p.d) + '</div>' +
    '<div class="pn"><h3>Trong Pancake</h3>' + (p.trung ? '<p class="ghi" role="note"><b>Trùng số điện thoại.</b> Số này có ở một bản ghi khác trong bảng. Xem lại trước khi gọi, trang không tự gộp.</p>' : '') + (p.pancake === null ? '<p class="gc">Chưa nối. Đã gọi chưa, hẹn gọi lại và kết quả ghi và xem trong Pancake. Khi nối xong, thông tin đó hiện lại ở đây.</p>' : !p.pancake.length ? '<p class="gc">Số này chưa có trong Pancake, hoặc chưa có cột nào được ghi.</p>' : '<p class="gc">Đọc từ Pancake, cập nhật mỗi 5 phút. Sửa thì sửa trong Pancake.</p><dl class="kv">' + p.pancake.map(x => '<dt>' + esc(x[0]) + '</dt><dd>' + esc(x[1]) + '</dd>').join('') + '</dl>') + '</div></div>' +
    '<div class="df"><button class="bt o" data-act="sau">Người tiếp theo</button></div></aside>';
  if (S.v === 'q' || S.v === 'tv') drawTbl();
}
function dongDr() { S.dr = -1; $('dro').innerHTML = ''; if (S.v === 'q' || S.v === 'tv') drawTbl(); }
function ptPanel(p) {
  const qt = D.vai_tro === 'Quản trị', cua = p.phu_trach === D.email;
  return '<div class="pn"><h3>Người phụ trách</h3><p class="gc">' + (!p.phu_trach ? 'Chưa ai nhận khách này.' : cua ? 'Bạn đang phụ trách khách này.' : 'Đang do <b>' + esc(p.phu_trach) + '</b> phụ trách.') + '</p>' +
    (!p.phu_trach ? '<button class="bt" data-act="nhan">Nhận khách này</button>' : cua ? '<button class="bt o" data-act="tra">Trả lại</button>' : '') +
    (qt ? '<label class="gc" style="display:block;margin-top:8px">Giao cho <select data-giao="1"><option value="">Chưa giao</option>' + D.danh_sach.map(x => '<option value="' + esc(x.email) + '"' + (x.email === p.phu_trach ? ' selected' : '') + '>' + esc(x.email) + ' (' + esc(x.vai_tro) + ')</option>').join('') + '</select></label>' : '') + '</div>';
}
function giao(em, xong) {
  const i = S.dr; toast('Đang lưu…');
  google.script.run.withSuccessHandler(e => { P[i].phu_trach = e; if (S.dr === i) drawer(i); toast(xong); })
    .withFailureHandler(er => { toast('Chưa lưu được. ' + (er && er.message || er)); if (S.dr === i) drawer(i); }).nhanKhach(P[i].id, em);
}
function ke(dir) { const i = S.order.indexOf(S.dr), j = i + dir; if (i >= 0 && S.order[j] !== undefined) drawer(S.order[j]); }

/* ===== Điều hướng ===== */
function ve() {
  $('ttl').textContent = TTL[S.v];
  document.querySelectorAll('.sb [data-v]').forEach(b => b.setAttribute('aria-current', b.dataset.v === S.v ? 'page' : 'false'));
  $('n-q').textContent = P.filter(p => p.ng3).length; $('n-tv').textContent = P.length;
  $('main').innerHTML = S.v === 'tq' ? tongQuan() : S.v === 'cd' ? caiDat() : S.v === 'hd' ? huongDan() : dsach();
  if (S.v === 'q' || S.v === 'tv') drawTbl();
}
const locRong = () => ({ cell: '', cap: '', vt: '', w: '', risk: '' });
function den(v) { S.v = v; S.page = 1; S.stage = 'all'; S.f = locRong(); S.q = ''; S.sort = { k: 'prio', dir: -1 }; ve(); window.scrollTo(0, 0); }

document.addEventListener('click', e => {
  const t = e.target, $c = s => t.closest && t.closest(s); let x;
  if (x = $c('[data-v]')) { den(x.dataset.v); return; }
  if (x = $c('[data-sc]')) { const el = $(x.dataset.sc); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (x = $c('[data-go]')) { const g = x.dataset.go; den(g === 'cho' ? 'q' : 'tv');
    if (g === 'risk' || g === 'trung') S.f.risk = g; else if (g === 'none') S.f.cell = 'none'; else if (g.startsWith('cell-')) S.f.cell = g.slice(5); ve(); return; }
  if (x = $c('[data-stage]')) { S.stage = x.dataset.stage; S.page = 1; drawTbl(); return; }
  if (x = $c('[data-sort]')) { const k = x.dataset.sort; S.sort = { k, dir: S.sort.k === k ? -S.sort.dir : (k === 'name' ? 1 : -1) }; drawTbl(); return; }
  if (x = $c('[data-pg]')) { S.page = +x.dataset.pg; drawTbl(); return; }
  if (x = $c('[data-vw]')) { const v = x.dataset.vw; S.f = locRong(); S.stage = 'all'; S.q = ''; S.page = 1;
    if (v === 'cc') S.f.cell = 'cc'; if (v === 'lot') S.f.cap = '2'; if (v === 'nguy') { S.f.risk = 'risk'; S.v = 'tv'; } if (v === 'trung') { S.f.risk = 'trung'; S.v = 'tv'; } if (v === 'none') { S.f.cell = 'none'; S.v = 'tv'; }
    S.sort = { k: 'prio', dir: -1 }; ve(); return; }
  if (x = $c('[data-act]')) { const a = x.dataset.act;
    if (a === 'dong') dongDr(); else if (a === 'truoc') ke(-1); else if (a === 'sau') ke(1);
    else if (a === 'them') { const em = $('tv-em').value.trim(), vt = $('tv-vt').value; if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { toast('Email chưa đúng.'); $('tv-em').focus(); } else luuTv(em, vt, 'Đã thêm ' + em + ', vai trò ' + vt + '.'); }
    else if (a === 'go') { const em = x.dataset.em; if (confirm('Gỡ ' + em + ' khỏi trang quản trị? Người này cũng mất quyền xem Google Sheet nơi nhận bài.')) luuTv(em, '', 'Đã gỡ ' + em + '.'); }
    else if (a === 'nhan') giao(D.email, 'Đã nhận khách. Sales khác không còn thấy khách này.');
    else if (a === 'tra') { if (confirm('Trả lại khách này? Sales khác sẽ thấy và nhận được.')) giao('', 'Đã trả lại khách.'); }
    else if (a === 'chep') { const p = P[S.dr]; (navigator.clipboard ? navigator.clipboard.writeText(p.sdt) : Promise.reject()).then(() => toast('Đã chép số điện thoại.')).catch(() => toast('Không chép tự động được, bạn bôi đen số để chép.')); }
    return; }
  if (x = $c('[data-p]')) { drawer(+x.dataset.p); return; }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; S.page = 1; drawTbl(); }
  if (t.id === 'tc') { const v = +t.value; if (v >= 10 && v <= 100) { S.thr = v / 100; clearTimeout(input.h); input.h = setTimeout(() => { ve(); const e2 = $('tc'); e2.focus(); toast('Đã đổi ngưỡng. Mở Tổng quan để thấy bốn ô thay đổi.'); }, 700); } }
});
function input() {}
document.addEventListener('change', e => {
  const t = e.target, m = { 'f-cell': 'cell', 'f-cap': 'cap', 'f-vt': 'vt', 'f-w': 'w' };
  if (m[t.id]) { S.f[m[t.id]] = t.value; S.page = 1; drawTbl(); }
  if (t.id === 'sz') { S.size = +t.value; S.page = 1; drawTbl(); }
  if (t.id === 'cp') { S.compact = t.checked; drawTbl(); }
  if (t.dataset && t.dataset.giao) giao(t.value, t.value ? 'Đã giao cho ' + t.value + '.' : 'Đã bỏ người phụ trách.');
  if (t.dataset && t.dataset.tv) luuTv(t.dataset.tv, t.value, 'Đã đổi ' + t.dataset.tv + ' sang ' + t.value + '.');
});
$('gq').addEventListener('keydown', e => { if (e.key === 'Enter') { const q = e.target.value; den('tv'); S.q = q; ve(); } });
document.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (e.key === 'Escape' && S.dr >= 0) dongDr();
  else if (S.dr >= 0 && !/INPUT|SELECT|TEXTAREA/.test(tg)) { if (e.key === 'j') ke(1); if (e.key === 'k') ke(-1); }
  else if (e.key === 'Enter' && e.target.matches && e.target.matches('tr.row')) drawer(+e.target.dataset.p);
});

/* ===== Lấy dữ liệu ===== */
function luuTv(em, vt, xong) {
  toast('Đang lưu…');
  google.script.run.withSuccessHandler(ds => { D.danh_sach = ds; ve(); toast(xong); })
    .withFailureHandler(er => { ve(); toast('Chưa lưu được. ' + (er && er.message || er)); }).luuThanhVien(em, vt);
}
function bao(tieude, noidung) { $('main').innerHTML = '<div class="pn" style="max-width:640px;margin-top:20px"><h3>' + tieude + '</h3><p>' + noidung + '</p><p><button class="bt" id="thu">Thử lại</button></p></div>'; $('thu').onclick = tai; }
function tai() {
  $('main').innerHTML = '<div class="pn" style="margin-top:20px"><p>Đang lấy dữ liệu từ Google Sheet…</p></div>';
  google.script.run.withSuccessHandler(r => {
    if (!r || !r.quyen) { document.querySelector('.app').innerHTML = '<div class="mn"><div class="pn" style="max-width:560px;margin:40px auto"><h3>Bạn chưa có quyền mở trang này</h3><p>' + (r && r.email ? 'Email <b>' + esc(r.email) + '</b> chưa có trong danh sách.' : 'Google không đưa email của bạn cho trang này. Hãy đăng nhập bằng tài khoản Google công việc rồi mở lại đường dẫn.') + '</p><p>Gửi email đó cho quản trị để được thêm vào trang tính “Quản trị”, rồi tải lại trang.</p></div></div>'; return; }
    D = r; S.thr = r.cai_dat.nguong_truc; S.min = r.cai_dat.toi_thieu_xet; nap(r);
    $('vt').textContent = r.vai_tro + ' · ' + r.email; $('vt').title = 'Dữ liệu lấy lúc ' + new Date().toLocaleTimeString('vi-VN');
    if (S.dr >= 0) dongDr(); ve();
  }).withFailureHandler(er => bao('Không đọc được dữ liệu', 'Thường do email của bạn chưa được chia sẻ Google Sheet nơi nhận bài ở quyền Người xem, hoặc mạng bị ngắt. Chi tiết: ' + esc(er && er.message || er))).layDuLieuQuanTri();
}
$('rl').onclick = tai;
tai();
</script>
</body>
</html>
